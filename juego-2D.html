<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jerry's Great Escape</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const BASE_W = 800, BASE_H = 480;
canvas.width = BASE_W;
canvas.height = BASE_H;

// --- CONSTANTES ---
const GRAVITY = 0.55;
const PLAYER_SPEED = 3.8;
const PLAYER_ACCEL = 0.55;
const PLAYER_FRICTION = 0.78;
const JUMP_FORCE = -13.5;
const JUMP_HOLD = 0.6;
const TILE = 40;
const LEVEL_WIDTH = 6400;

// --- ESTADO ---
let state = 'start'; // 'start', 'playing', 'gameover', 'win'
let keys = {};
let jumpHeld = 0;
let wasJumpDown = false;
let particles = [];
let floatingTexts = [];

// --- CÁMARA ---
let camX = 0;

// --- JUGADOR ---
let player = {};

// --- ENEMIGOS ---
let enemies = [];
let tom = {};

// --- COLECCIONABLES ---
let cheeses = [];
let questionBlocks = [];
let brickBlocks = [];
let traps = [];
let score = 0;
let lives = 3;

// --- NIVEL ---
const GROUND_Y = BASE_H - TILE;
let goalX = LEVEL_WIDTH - 200;

// ---------- GENERADOR DE NIVEL ----------
function buildLevel() {
  cheeses = [];
  questionBlocks = [];
  brickBlocks = [];
  traps = [];
  enemies = [];

  // Suelo base
  // Las plataformas se generan dinámicamente en el render

  // Bloques de interrogación (con queso)
  const qbPositions = [
    {x:300,y:GROUND_Y-3*TILE},{x:500,y:GROUND_Y-3*TILE},{x:900,y:GROUND_Y-3*TILE},
    {x:1200,y:GROUND_Y-4*TILE},{x:1500,y:GROUND_Y-3*TILE},{x:1800,y:GROUND_Y-3*TILE},
    {x:2100,y:GROUND_Y-4*TILE},{x:2400,y:GROUND_Y-3*TILE},{x:2700,y:GROUND_Y-3*TILE},
    {x:3000,y:GROUND_Y-4*TILE},{x:3300,y:GROUND_Y-3*TILE},{x:3600,y:GROUND_Y-3*TILE},
    {x:3900,y:GROUND_Y-4*TILE},{x:4200,y:GROUND_Y-3*TILE},{x:4600,y:GROUND_Y-3*TILE},
    {x:5000,y:GROUND_Y-3*TILE},{x:5400,y:GROUND_Y-4*TILE},{x:5800,y:GROUND_Y-3*TILE},
  ];
  qbPositions.forEach(p => questionBlocks.push({x:p.x,y:p.y,w:TILE,h:TILE,hit:false,bounceY:0}));

  // Bloques de ladrillo
  const brickSets = [
    {x:360,y:GROUND_Y-3*TILE,n:3},{x:660,y:GROUND_Y-3*TILE,n:4},
    {x:1050,y:GROUND_Y-3*TILE,n:3},{x:1350,y:GROUND_Y-4*TILE,n:2},
    {x:1650,y:GROUND_Y-3*TILE,n:3},{x:1950,y:GROUND_Y-3*TILE,n:4},
    {x:2250,y:GROUND_Y-3*TILE,n:3},{x:2550,y:GROUND_Y-4*TILE,n:2},
    {x:2850,y:GROUND_Y-3*TILE,n:3},{x:3150,y:GROUND_Y-3*TILE,n:4},
    {x:3450,y:GROUND_Y-3*TILE,n:3},{x:3750,y:GROUND_Y-4*TILE,n:2},
    {x:4050,y:GROUND_Y-3*TILE,n:3},{x:4350,y:GROUND_Y-3*TILE,n:4},
    {x:4800,y:GROUND_Y-3*TILE,n:3},{x:5200,y:GROUND_Y-4*TILE,n:3},
    {x:5600,y:GROUND_Y-3*TILE,n:4},
  ];
  brickSets.forEach(b => {
    for(let i=0;i<b.n;i++) brickBlocks.push({x:b.x+i*TILE,y:b.y,w:TILE,h:TILE,alive:true,bounceY:0});
  });

  // Plataformas flotantes
  const platforms = [
    {x:450,y:GROUND_Y-5*TILE,w:3},{x:700,y:GROUND_Y-6*TILE,w:2},
    {x:1100,y:GROUND_Y-5*TILE,w:3},{x:1400,y:GROUND_Y-6*TILE,w:2},
    {x:1700,y:GROUND_Y-5*TILE,w:4},{x:2000,y:GROUND_Y-6*TILE,w:2},
    {x:2300,y:GROUND_Y-5*TILE,w:3},{x:2600,y:GROUND_Y-6*TILE,w:2},
    {x:2900,y:GROUND_Y-5*TILE,w:3},{x:3200,y:GROUND_Y-6*TILE,w:2},
    {x:3500,y:GROUND_Y-5*TILE,w:3},{x:3800,y:GROUND_Y-7*TILE,w:2},
    {x:4100,y:GROUND_Y-5*TILE,w:3},{x:4400,y:GROUND_Y-6*TILE,w:2},
    {x:4700,y:GROUND_Y-5*TILE,w:3},{x:5100,y:GROUND_Y-6*TILE,w:2},
    {x:5500,y:GROUND_Y-5*TILE,w:3},{x:5900,y:GROUND_Y-6*TILE,w:2},
  ];
  platforms.forEach(p => {
    for(let i=0;i<p.w;i++) brickBlocks.push({x:p.x+i*TILE,y:p.y,w:TILE,h:TILE,alive:true,bounceY:0,platform:true});
  });

  // Trampas de ratón
  const trapPositions = [400,620,850,1100,1350,1600,1900,2200,2500,2800,3100,3400,3700,4000,4300,4700,5100,5500,5900];
  trapPositions.forEach(x => traps.push({x:x,y:GROUND_Y-24,w:30,h:24,active:true}));

  // Quesos pequeños en suelo
  const cheeseGroundX = [250,460,660,860,1060,1260,1460,1660,1860,2060,2260,2460,2660,2860,3060,3260,3460,3660,3860,4060,4260,4460,4660,4860,5060,5260,5460,5660,5860];
  cheeseGroundX.forEach(x => cheeses.push({x:x+10,y:GROUND_Y-28,w:20,h:20,collected:false,onBlock:false}));

  // Quesos en plataformas
  platforms.forEach(p => {
    cheeses.push({x:p.x+Math.floor(p.w/2)*TILE+10,y:p.y-28,w:20,h:20,collected:false,onBlock:false});
  });

  // Enemigos tipo "Butch" (gatos aliados)
  const enemyPositions = [
    {x:600,range:150},{x:1000,range:200},{x:1400,range:150},{x:1800,range:180},
    {x:2200,range:150},{x:2600,range:200},{x:3000,range:150},{x:3400,range:180},
    {x:3800,range:150},{x:4200,range:200},{x:4600,range:150},{x:5000,range:180},
    {x:5400,range:150},{x:5800,range:200},
  ];
  enemyPositions.forEach(e => enemies.push({
    x:e.x, y:GROUND_Y-TILE, w:36, h:36,
    vx:1.2, startX:e.x, range:e.range,
    alive:true, onGround:true,
    animFrame:0, animTimer:0
  }));
}

function resetPlayer() {
  player = {
    x: 60, y: GROUND_Y - TILE,
    w: 28, h: 36,
    vx: 0, vy: 0,
    onGround: false,
    facingRight: true,
    animFrame: 0, animTimer: 0,
    jumpPressed: false,
    invincible: 0,
  };
}

function resetTom() {
  tom = {
    x: -80, y: GROUND_Y - TILE*1.8,
    w: 50, h: 52,
    vx: 1.5,
    alive: true,
    animFrame: 0, animTimer: 0
  };
}

function initGame() {
  score = 0;
  lives = 3;
  camX = 0;
  particles = [];
  floatingTexts = [];
  buildLevel();
  resetPlayer();
  resetTom();
  state = 'playing';
}

// ---------- COLISIÓN AABB ----------
function rectOverlap(a, b) {
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

// ---------- BLOQUES SÓLIDOS (array unificado) ----------
function getAllSolidBlocks() {
  const arr = [];
  brickBlocks.forEach(b => { if(b.alive) arr.push(b); });
  questionBlocks.forEach(b => arr.push(b));
  return arr;
}

// ---------- PHYSICS + COLLISIONS ----------
function resolveBlocks(entity, solidBlocks) {
  // eje Y
  entity.y += entity.vy;
  entity.onGround = false;

  // Suelo base
  if(entity.y + entity.h > GROUND_Y) {
    entity.y = GROUND_Y - entity.h;
    entity.vy = 0;
    entity.onGround = true;
  }

  solidBlocks.forEach(b => {
    const bY = b.y - b.bounceY;
    const block = {x:b.x,y:bY,w:b.w,h:b.h};
    if(rectOverlap(entity, block)) {
      const overlapTop = (entity.y + entity.h) - bY;
      const overlapBot = (bY + block.h) - entity.y;
      if(overlapTop < overlapBot) {
        entity.y = bY - entity.h;
        entity.vy = 0;
        entity.onGround = true;
      } else {
        entity.y = bY + block.h;
        // colisión de cabeza
        if(entity === player && entity.vy < 0) {
          entity.vy = 0;
          hitBlock(b);
        }
      }
    }
  });

  // eje X
  entity.x += entity.vx;
  solidBlocks.forEach(b => {
    const bY = b.y - b.bounceY;
    const block = {x:b.x,y:bY,w:b.w,h:b.h};
    if(rectOverlap(entity, block)) {
      if(entity.vx > 0) entity.x = b.x - entity.w;
      else if(entity.vx < 0) entity.x = b.x + b.w;
      if(entity !== player) entity.vx *= -1;
      else entity.vx = 0;
    }
  });
}

function hitBlock(b) {
  if(b.hit) return;
  b.bounceY = 0;
  if(b.question !== undefined || questionBlocks.includes(b)) {
    // bloque de interrogación → suelta queso
    if(!b.hit) {
      b.hit = true;
      spawnBlockCheese(b.x + b.w/2 - 10, b.y - 30);
      spawnParticles(b.x+b.w/2, b.y, '#f0c040', 8);
      animateBounce(b);
    }
  } else if(!b.platform) {
    // ladrillo → destrozar
    b.alive = false;
    spawnParticles(b.x+b.w/2, b.y+b.h/2, '#c87941', 10);
  } else {
    animateBounce(b);
  }
}

function animateBounce(b) {
  let t = 0;
  const orig = b.y;
  const interval = setInterval(() => {
    t += 0.25;
    b.bounceY = Math.sin(t) * 6;
    if(t > Math.PI) { b.bounceY = 0; clearInterval(interval); }
  }, 16);
}

function spawnBlockCheese(x, y) {
  cheeses.push({x:x,y:y,w:20,h:20,collected:false,onBlock:true,vy:-4,gy:0.3});
}

// ---------- PARTÍCULAS ----------
function spawnParticles(x, y, color, count) {
  for(let i=0;i<count;i++) {
    particles.push({
      x:x, y:y,
      vx:(Math.random()-0.5)*5,
      vy:(Math.random()-0.5)*5 - 2,
      life:1, color:color, r:3+Math.random()*3
    });
  }
}

function addFloatingText(x, y, text, color='#ffe000') {
  floatingTexts.push({x,y,text,color,life:1,vy:-1.5});
}

// ---------- ACTUALIZAR PARTÍCULAS ----------
function updateParticles() {
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.15;
    p.life -= 0.04;
  });
  floatingTexts = floatingTexts.filter(t => t.life > 0);
  floatingTexts.forEach(t => { t.y += t.vy; t.life -= 0.025; });
}

// ---------- ACTUALIZAR ENEMIGOS ----------
function updateEnemies(solidBlocks) {
  enemies.forEach(e => {
    if(!e.alive) return;
    e.vy = (e.vy || 0) + GRAVITY;
    resolveBlocks(e, solidBlocks);
    e.x += e.vx;
    if(e.x < e.startX) { e.vx = Math.abs(e.vx); }
    if(e.x > e.startX + e.range) { e.vx = -Math.abs(e.vx); }
    e.animTimer++;
    if(e.animTimer > 14) { e.animFrame ^= 1; e.animTimer = 0; }
  });
}

// ---------- TOM ----------
function updateTom() {
  if(!tom.alive) return;
  tom.x += tom.vx;
  // Tom sigue a Jerry en Y (salta un poco si está sobre plataforma)
  if(tom.y + tom.h < GROUND_Y) tom.y += 2;
  if(tom.y + tom.h > GROUND_Y) tom.y = GROUND_Y - tom.h;
  tom.animTimer = (tom.animTimer||0) + 1;
  if(tom.animTimer > 12) { tom.animFrame ^= 1; tom.animTimer = 0; }
}

// ---------- PLAYER INPUT ----------
function updatePlayer(solidBlocks) {
  // Aceleración horizontal
  if(keys['ArrowLeft'] || keys['KeyA']) {
    player.vx -= PLAYER_ACCEL;
    player.facingRight = false;
  } else if(keys['ArrowRight'] || keys['KeyD']) {
    player.vx += PLAYER_ACCEL;
    player.facingRight = true;
  }
  // Fricción
  if(!keys['ArrowLeft'] && !keys['KeyA'] && !keys['ArrowRight'] && !keys['KeyD']) {
    player.vx *= PLAYER_FRICTION;
    if(Math.abs(player.vx) < 0.1) player.vx = 0;
  }
  // Límite de velocidad
  player.vx = Math.max(-PLAYER_SPEED, Math.min(PLAYER_SPEED, player.vx));

  // Salto variable
  const jumpDown = keys['ArrowUp'] || keys['KeyW'] || keys[' '] || keys['Space'];
  if(jumpDown && !wasJumpDown && player.onGround) {
    player.vy = JUMP_FORCE;
    player.onGround = false;
    jumpHeld = 0;
  }
  if(jumpDown && !player.onGround && player.vy < 0) {
    jumpHeld += 1/60;
    if(jumpHeld < JUMP_HOLD) player.vy -= 0.3;
  }
  if(!jumpDown) jumpHeld = JUMP_HOLD;
  wasJumpDown = jumpDown;

  // Gravedad
  if(!player.onGround) player.vy += GRAVITY;

  resolveBlocks(player, solidBlocks);

  // Límites del nivel
  if(player.x < 0) { player.x = 0; player.vx = 0; }

  // Animación
  if(player.onGround && Math.abs(player.vx) > 0.3) {
    player.animTimer++;
    if(player.animTimer > 8) { player.animFrame = (player.animFrame+1)%4; player.animTimer = 0; }
  } else if(player.onGround) {
    player.animFrame = 0;
  } else {
    player.animFrame = 2;
  }

  // Invincibilidad
  if(player.invincible > 0) player.invincible--;
}

// ---------- COLISIONES JUGADOR ----------
function checkPlayerCollisions() {
  if(player.invincible > 0) return;

  // Trampas
  traps.forEach(t => {
    if(!t.active) return;
    if(rectOverlap(player, t)) {
      loseLife();
    }
  });

  // Enemigos (Butch cats)
  enemies.forEach(e => {
    if(!e.alive) return;
    if(rectOverlap(player, e)) {
      const pBottom = player.y + player.h;
      const eTop = e.y;
      if(pBottom <= eTop + 12 && player.vy > 0) {
        // Salta encima → elimina enemigo
        e.alive = false;
        player.vy = -9;
        score += 200;
        spawnParticles(e.x+e.w/2, e.y, '#ff6688', 12);
        addFloatingText(e.x+e.w/2 - camX, e.y, '+200', '#ff88aa');
      } else {
        loseLife();
      }
    }
  });

  // Tom
  if(tom.alive && rectOverlap(player, tom)) {
    loseLife();
  }

  // Quesos
  cheeses.forEach(c => {
    if(c.collected) return;
    if(rectOverlap(player, c)) {
      c.collected = true;
      score += 100;
      spawnParticles(c.x+c.w/2, c.y+c.h/2, '#f0c040', 6);
      addFloatingText(c.x - camX, c.y - 10, '+100', '#ffe000');
    }
  });

  // Quesos flotando (de bloques ?)
  cheeses.forEach(c => {
    if(c.onBlock && !c.collected) {
      if(c.vy !== undefined) {
        c.vy += c.gy;
        c.y += c.vy;
        if(c.y + c.h >= GROUND_Y) { c.y = GROUND_Y - c.h; c.vy = 0; c.gy = 0; c.onBlock = false; }
      }
    }
  });

  // Meta
  const goal = {x:goalX, y:GROUND_Y-TILE*3, w:60, h:TILE*3};
  if(rectOverlap(player, goal)) {
    state = 'win';
  }
}

function loseLife() {
  lives--;
  player.invincible = 120;
  player.vy = -8;
  spawnParticles(player.x+player.w/2, player.y, '#ff4444', 16);
  if(lives <= 0) {
    state = 'gameover';
  }
}

// ---------- CÁMARA ----------
function updateCamera() {
  const target = player.x - BASE_W * 0.35;
  camX += (target - camX) * 0.1;
  camX = Math.max(0, Math.min(LEVEL_WIDTH - BASE_W, camX));
}

// ---------- DIBUJO ----------

function drawBackground() {
  // Cielo degradado (plano)
  ctx.fillStyle = '#87CEEB';
  ctx.fillRect(0, 0, BASE_W, BASE_H);
  // Nubes
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  const cloudOffsets = [100,350,620,950,1300,1700,2100,2500,2900,3300,3700,4100,4500,4900,5300,5700,6100];
  cloudOffsets.forEach(cx => {
    const sx = cx - camX * 0.4;
    if(sx > -120 && sx < BASE_W + 120) {
      drawCloud(sx, 60);
      drawCloud(sx + 180, 100);
    }
  });
  // Césped
  ctx.fillStyle = '#5a9e2f';
  ctx.fillRect(0, GROUND_Y, BASE_W, BASE_H - GROUND_Y);
  ctx.fillStyle = '#4a8a22';
  ctx.fillRect(0, GROUND_Y, BASE_W, 8);
}

function drawCloud(x, y) {
  ctx.beginPath();
  ctx.arc(x, y, 28, 0, Math.PI*2);
  ctx.arc(x+28, y-10, 22, 0, Math.PI*2);
  ctx.arc(x+54, y, 28, 0, Math.PI*2);
  ctx.arc(x+28, y+10, 22, 0, Math.PI*2);
  ctx.fill();
}

function worldToScreen(wx) { return wx - camX; }

function drawTiles() {
  // Suelo base
  const startTile = Math.floor(camX / TILE);
  const endTile = startTile + Math.ceil(BASE_W / TILE) + 2;
  for(let i = startTile; i <= endTile; i++) {
    const sx = i * TILE - camX;
    // Capa superior
    ctx.fillStyle = '#8BC34A';
    ctx.fillRect(sx, GROUND_Y, TILE, 8);
    ctx.fillStyle = '#795548';
    ctx.fillRect(sx, GROUND_Y + 8, TILE, BASE_H - GROUND_Y - 8);
    ctx.strokeStyle = '#6D4C41';
    ctx.lineWidth = 1;
    ctx.strokeRect(sx, GROUND_Y + 8, TILE, TILE);
  }
}

function drawBrickBlock(b) {
  if(!b.alive) return;
  const sx = worldToScreen(b.x);
  const sy = b.y - b.bounceY;
  if(sx < -TILE || sx > BASE_W+TILE) return;
  if(b.platform) {
    ctx.fillStyle = '#8BC34A';
    ctx.fillRect(sx, sy, b.w, b.h);
    ctx.fillStyle = '#5a9e2f';
    ctx.fillRect(sx, sy, b.w, 6);
    ctx.strokeStyle = '#4a8a22';
    ctx.lineWidth = 1;
    ctx.strokeRect(sx, sy, b.w, b.h);
  } else {
    ctx.fillStyle = '#c87941';
    ctx.fillRect(sx, sy, b.w, b.h);
    ctx.strokeStyle = '#8B4513';
    ctx.lineWidth = 2;
    ctx.strokeRect(sx, sy, b.w, b.h);
    // cruz de ladrillo
    ctx.beginPath();
    ctx.moveTo(sx + b.w/2, sy);
    ctx.lineTo(sx + b.w/2, sy + b.h);
    ctx.moveTo(sx, sy + b.h/2);
    ctx.lineTo(sx + b.w, sy + b.h/2);
    ctx.strokeStyle = '#8B4513';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

function drawQuestionBlock(b) {
  const sx = worldToScreen(b.x);
  const sy = b.y - b.bounceY;
  if(sx < -TILE || sx > BASE_W+TILE) return;
  if(b.hit) {
    ctx.fillStyle = '#8B7355';
    ctx.fillRect(sx, sy, b.w, b.h);
    ctx.strokeStyle = '#5a4a2a';
    ctx.lineWidth = 2;
    ctx.strokeRect(sx, sy, b.w, b.h);
  } else {
    ctx.fillStyle = '#f0a500';
    ctx.fillRect(sx, sy, b.w, b.h);
    ctx.strokeStyle = '#c87800';
    ctx.lineWidth = 2;
    ctx.strokeRect(sx, sy, b.w, b.h);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 22px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('?', sx + b.w/2, sy + b.h - 8);
  }
}

function drawCheese(c) {
  if(c.collected) return;
  const sx = worldToScreen(c.x);
  const sy = c.y;
  if(sx < -30 || sx > BASE_W+30) return;
  // Forma de queso (triángulo con huecos)
  ctx.fillStyle = '#f5c518';
  ctx.beginPath();
  ctx.moveTo(sx + c.w/2, sy);
  ctx.lineTo(sx + c.w, sy + c.h);
  ctx.lineTo(sx, sy + c.h);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#ffdd44';
  ctx.beginPath();
  ctx.arc(sx + c.w/2, sy + c.h*0.55, 3, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#e0a800';
  ctx.beginPath();
  ctx.arc(sx + c.w*0.3, sy + c.h*0.75, 2.5, 0, Math.PI*2);
  ctx.fill();
}

function drawTrap(t) {
  if(!t.active) return;
  const sx = worldToScreen(t.x);
  if(sx < -40 || sx > BASE_W+40) return;
  // Trampa de ratón (U shape)
  ctx.fillStyle = '#888';
  ctx.fillRect(sx, t.y + 8, t.w, t.h - 8);
  ctx.strokeStyle = '#444';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(sx + 4, t.y + 8);
  ctx.lineTo(sx + 4, t.y + 2);
  ctx.lineTo(sx + t.w - 4, t.y + 2);
  ctx.lineTo(sx + t.w - 4, t.y + 8);
  ctx.stroke();
  // muelle
  ctx.strokeStyle = '#c00';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(sx + t.w/2 - 4, t.y + 4);
  ctx.lineTo(sx + t.w/2 + 4, t.y + 4);
  ctx.stroke();
}

function drawEnemy(e) {
  if(!e.alive) return;
  const sx = worldToScreen(e.x);
  if(sx < -50 || sx > BASE_W+50) return;
  const facing = e.vx > 0 ? 1 : -1;
  ctx.save();
  if(facing < 0) { ctx.translate(sx + e.w, e.y); ctx.scale(-1,1); }
  else ctx.translate(sx, e.y);
  // Cuerpo gato "Butch"
  ctx.fillStyle = '#4a4a6a';
  ctx.fillRect(4, 8, 28, 24);
  // Cabeza
  ctx.fillRect(2, 2, 32, 22);
  // Orejas
  ctx.fillStyle = '#4a4a6a';
  ctx.beginPath(); ctx.moveTo(4,4); ctx.lineTo(0,0); ctx.lineTo(10,4); ctx.fill();
  ctx.beginPath(); ctx.moveTo(22,4); ctx.lineTo(28,4); ctx.lineTo(34,0); ctx.fill();
  // Ojos
  ctx.fillStyle = '#ff6600';
  ctx.beginPath(); ctx.arc(11, 12, 4, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(25, 12, 4, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(12, 12, 2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(26, 12, 2, 0, Math.PI*2); ctx.fill();
  // Bigotes
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(18,16); ctx.lineTo(4,14); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(18,16); ctx.lineTo(4,18); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(18,16); ctx.lineTo(32,14); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(18,16); ctx.lineTo(32,18); ctx.stroke();
  // Patas animadas
  const legOff = e.animFrame === 0 ? 2 : -2;
  ctx.fillStyle = '#4a4a6a';
  ctx.fillRect(6, 30 + legOff, 8, 10);
  ctx.fillRect(22, 30 - legOff, 8, 10);
  ctx.restore();
}

function drawTom() {
  if(!tom.alive) return;
  const sx = worldToScreen(tom.x);
  if(sx < -70 || sx > BASE_W+70) return;
  ctx.save();
  ctx.translate(sx, tom.y);
  // Cuerpo Tom (gris azulado)
  ctx.fillStyle = '#6a8ab5';
  ctx.fillRect(5, 14, 40, 36);
  // Cabeza
  ctx.fillStyle = '#7a9dc8';
  ctx.beginPath(); ctx.arc(25, 18, 20, 0, Math.PI*2); ctx.fill();
  // Orejas
  ctx.fillStyle = '#6a8ab5';
  ctx.beginPath(); ctx.moveTo(8,6); ctx.lineTo(2,0); ctx.lineTo(18,8); ctx.fill();
  ctx.beginPath(); ctx.moveTo(32,6); ctx.lineTo(42,0); ctx.lineTo(48,8); ctx.fill();
  ctx.fillStyle = '#ffaab0';
  ctx.beginPath(); ctx.moveTo(9,6); ctx.lineTo(4,2); ctx.lineTo(16,8); ctx.fill();
  // Cara
  ctx.fillStyle = '#b0c8e8';
  ctx.beginPath(); ctx.ellipse(25, 22, 13, 10, 0, 0, Math.PI*2); ctx.fill();
  // Ojos
  ctx.fillStyle = '#1a7a1a';
  ctx.beginPath(); ctx.arc(17, 14, 5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(33, 14, 5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(18, 14, 2.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(34, 14, 2.5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(19,13,1,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(35,13,1,0,Math.PI*2); ctx.fill();
  // Nariz
  ctx.fillStyle = '#ff8888';
  ctx.beginPath(); ctx.arc(25, 20, 3, 0, Math.PI*2); ctx.fill();
  // Bigotes
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
  for(let i=-1;i<=1;i++) {
    ctx.beginPath(); ctx.moveTo(22,21+i*3); ctx.lineTo(6,19+i*4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(28,21+i*3); ctx.lineTo(44,19+i*4); ctx.stroke();
  }
  // Cola
  ctx.strokeStyle = '#6a8ab5'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(5,40); ctx.quadraticCurveTo(-10,30,-5,20); ctx.stroke();
  // Patas
  const lOff = tom.animFrame === 0 ? 3 : -3;
  ctx.fillStyle = '#6a8ab5';
  ctx.fillRect(8, 44 + lOff, 14, 12); ctx.fillRect(28, 44 - lOff, 14, 12);
  ctx.restore();
}

function drawJerry() {
  if(player.invincible > 0 && Math.floor(player.invincible/6) % 2 === 0) return;
  const sx = worldToScreen(player.x);
  ctx.save();
  if(!player.facingRight) { ctx.translate(sx + player.w, player.y); ctx.scale(-1,1); }
  else ctx.translate(sx, player.y);
  // Cuerpo
  ctx.fillStyle = '#c8843c';
  ctx.fillRect(4, 14, 20, 20);
  // Cabeza
  ctx.beginPath(); ctx.arc(14, 12, 13, 0, Math.PI*2);
  ctx.fill();
  // Orejas
  ctx.fillStyle = '#c8843c';
  ctx.beginPath(); ctx.ellipse(4, 2, 5, 8, -0.4, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(24, 2, 5, 8, 0.4, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ffaab0';
  ctx.beginPath(); ctx.ellipse(4, 2, 3, 5, -0.4, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(24, 2, 3, 5, 0.4, 0, Math.PI*2); ctx.fill();
  // Cara
  ctx.fillStyle = '#f0c080';
  ctx.beginPath(); ctx.ellipse(14, 14, 8, 7, 0, 0, Math.PI*2); ctx.fill();
  // Ojos
  ctx.fillStyle = '#3a1500';
  ctx.beginPath(); ctx.arc(9, 9, 3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(19, 9, 3, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(10,8,1,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(20,8,1,0,Math.PI*2); ctx.fill();
  // Nariz
  ctx.fillStyle = '#cc5555';
  ctx.beginPath(); ctx.arc(14, 14, 2, 0, Math.PI*2); ctx.fill();
  // Bigotes
  ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(12,15); ctx.lineTo(2,13); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(12,16); ctx.lineTo(2,18); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(16,15); ctx.lineTo(26,13); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(16,16); ctx.lineTo(26,18); ctx.stroke();
  // Cola
  ctx.strokeStyle = '#c8843c'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(24,26); ctx.quadraticCurveTo(36,22,32,14); ctx.stroke();
  // Patas
  const legOff = player.animFrame % 2 === 0 ? 2 : -2;
  ctx.fillStyle = '#c8843c';
  if(!player.onGround) {
    ctx.fillRect(4, 30, 8, 6); ctx.fillRect(16, 30, 8, 6);
  } else {
    ctx.fillRect(4, 30 + legOff, 8, 8); ctx.fillRect(16, 30 - legOff, 8, 8);
  }
  ctx.restore();
}

function drawGoal() {
  const sx = worldToScreen(goalX);
  if(sx < -100 || sx > BASE_W + 100) return;
  // Queso gigante
  const gy = GROUND_Y - TILE*3;
  const gw = 60, gh = TILE*3;
  ctx.fillStyle = '#f5c518';
  ctx.beginPath();
  ctx.moveTo(sx + gw/2, gy);
  ctx.lineTo(sx + gw, gy + gh);
  ctx.lineTo(sx, gy + gh);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#e0a800';
  ctx.lineWidth = 3;
  ctx.stroke();
  // Huecos
  ctx.fillStyle = '#c8950a';
  [[sx+gw*0.5, gy+gh*0.4,8],[sx+gw*0.3, gy+gh*0.6,6],[sx+gw*0.65, gy+gh*0.65,7]].forEach(h => {
    ctx.beginPath(); ctx.arc(h[0],h[1],h[2],0,Math.PI*2); ctx.fill();
  });
  // Brillos
  ctx.fillStyle = '#ffee66';
  ctx.beginPath(); ctx.arc(sx+gw*0.4, gy+gh*0.3, 5, 0, Math.PI*2); ctx.fill();
  // Etiqueta
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 11px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('META!', sx + gw/2, gy - 10);
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(worldToScreen(p.x), p.y, p.r, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function drawFloatingTexts() {
  floatingTexts.forEach(t => {
    ctx.globalAlpha = t.life;
    ctx.fillStyle = t.color;
    ctx.font = 'bold 16px Arial Black';
    ctx.textAlign = 'center';
    ctx.fillText(t.text, t.x, t.y);
  });
  ctx.globalAlpha = 1;
}

// ---------- HUD ----------
function drawHUD() {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, BASE_W, 42);

  ctx.fillStyle = '#ffe000';
  ctx.font = 'bold 14px Arial Black';
  ctx.textAlign = 'left';
  ctx.fillText('🧀 ' + score, 14, 26);

  // Vidas (dibujadas como caritas)
  ctx.fillText('❤️ x' + lives, 200, 26);

  // Distancia a la meta
  const dist = Math.max(0, Math.floor((goalX - player.x) / 10));
  ctx.textAlign = 'right';
  ctx.fillText('Meta: ' + dist + 'm', BASE_W - 14, 26);

  // Barra de progreso
  const prog = Math.min(1, player.x / goalX);
  ctx.fillStyle = '#333';
  ctx.fillRect(BASE_W/2 - 80, 8, 160, 10);
  ctx.fillStyle = '#4CAF50';
  ctx.fillRect(BASE_W/2 - 80, 8, 160 * prog, 10);
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 1;
  ctx.strokeRect(BASE_W/2 - 80, 8, 160, 10);
  // Ícono Jerry en barra
  ctx.fillStyle = '#c8843c';
  ctx.beginPath();
  ctx.arc(BASE_W/2 - 80 + 160*prog, 13, 5, 0, Math.PI*2);
  ctx.fill();

  ctx.restore();
}

// ---------- PANTALLAS ----------
function drawStartScreen() {
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0,0,BASE_W,BASE_H);

  // Fondo de caricatura
  ctx.fillStyle = '#87CEEB';
  ctx.fillRect(0, 0, BASE_W, BASE_H * 0.7);
  ctx.fillStyle = '#5a9e2f';
  ctx.fillRect(0, BASE_H * 0.7, BASE_W, BASE_H * 0.3);

  // Nubes decorativas
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  drawCloud(80, 80); drawCloud(320, 60); drawCloud(580, 90);

  // Título principal
  ctx.save();
  ctx.shadowColor = '#c87800';
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#f0a500';
  ctx.font = 'bold 52px Arial Black';
  ctx.textAlign = 'center';
  ctx.fillText("Jerry's Great Escape", BASE_W/2, 130);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 48px Arial Black';
  ctx.fillText("Jerry's Great Escape", BASE_W/2 + 2, 128);
  ctx.restore();

  // Jerry decorativo
  ctx.save();
  ctx.translate(BASE_W/2 - 80, 180);
  ctx.scale(2.5, 2.5);
  drawJerrySprite(0,0);
  ctx.restore();

  // Tom decorativo
  ctx.save();
  ctx.translate(BASE_W/2 + 40, 170);
  ctx.scale(2, 2);
  drawTomSprite(0,0,true);
  ctx.restore();

  // Instrucciones
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(BASE_W/2 - 200, BASE_H - 180, 400, 130);
  ctx.strokeStyle = '#f0a500';
  ctx.lineWidth = 2;
  ctx.strokeRect(BASE_W/2 - 200, BASE_H - 180, 400, 130);

  ctx.fillStyle = '#ffe000';
  ctx.font = 'bold 15px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('← → / A D: Mover   ↑ / W / Space: Saltar', BASE_W/2, BASE_H - 150);
  ctx.fillText('Salta sobre Butch para eliminarlo', BASE_W/2, BASE_H - 128);
  ctx.fillText('¡Golpea los bloques ? desde abajo!', BASE_W/2, BASE_H - 106);
  ctx.fillText('¡Llega al Queso Gigante para ganar!', BASE_W/2, BASE_H - 84);

  // Botón start
  const blink = Math.floor(Date.now()/500) % 2 === 0;
  if(blink) {
    ctx.fillStyle = '#f0a500';
    ctx.font = 'bold 22px Arial Black';
    ctx.textAlign = 'center';
    ctx.fillText('▶  PRESIONA ENTER O CLICK PARA INICIAR', BASE_W/2, BASE_H - 30);
  }
}

function drawTomSprite(ox, oy, mirror) {
  if(mirror) { ctx.save(); ctx.translate(ox+25,oy); ctx.scale(-1,1); ox=0; oy=0; }
  ctx.fillStyle = '#7a9dc8';
  ctx.beginPath(); ctx.arc(ox+14, oy+10, 12, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#6a8ab5';
  ctx.fillRect(ox+2, oy+18, 24, 20);
  ctx.fillStyle = '#b0c8e8';
  ctx.beginPath(); ctx.ellipse(ox+14, oy+13, 8, 6, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#1a7a1a';
  ctx.beginPath(); ctx.arc(ox+9, oy+8, 3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(ox+19, oy+8, 3, 0, Math.PI*2); ctx.fill();
  if(mirror) ctx.restore();
}

function drawJerrySprite(ox, oy) {
  ctx.fillStyle = '#c8843c';
  ctx.beginPath(); ctx.arc(ox+10, oy+8, 9, 0, Math.PI*2); ctx.fill();
  ctx.fillRect(ox+2, oy+14, 16, 14);
  ctx.fillStyle = '#f0c080';
  ctx.beginPath(); ctx.ellipse(ox+10, oy+10, 5, 4, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#3a1500';
  ctx.beginPath(); ctx.arc(ox+7, oy+6, 2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(ox+13, oy+6, 2, 0, Math.PI*2); ctx.fill();
}

function drawGameOverScreen() {
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(0,0,BASE_W,BASE_H);
  ctx.fillStyle = '#ff4444';
  ctx.font = 'bold 64px Arial Black';
  ctx.textAlign = 'center';
  ctx.fillText('GAME OVER', BASE_W/2, BASE_H/2 - 60);
  ctx.fillStyle = '#ffe000';
  ctx.font = 'bold 22px Arial';
  ctx.fillText('¡Tom atrapó a Jerry!', BASE_W/2, BASE_H/2 - 10);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 18px Arial';
  ctx.fillText('Quesos recolectados: ' + score, BASE_W/2, BASE_H/2 + 30);
  ctx.fillStyle = '#f0a500';
  ctx.font = 'bold 20px Arial Black';
  const blink = Math.floor(Date.now()/600) % 2 === 0;
  if(blink) ctx.fillText('ENTER o CLICK para reintentar', BASE_W/2, BASE_H/2 + 80);
}

function drawWinScreen() {
  ctx.fillStyle = 'rgba(20,80,20,0.8)';
  ctx.fillRect(0,0,BASE_W,BASE_H);
  ctx.fillStyle = '#ffe000';
  ctx.font = 'bold 58px Arial Black';
  ctx.textAlign = 'center';
  ctx.fillText('¡JERRY ESCAPÓ!', BASE_W/2, BASE_H/2 - 70);
  // Queso gigante decorativo en pantalla de victoria
  ctx.fillStyle = '#f5c518';
  ctx.beginPath();
  ctx.moveTo(BASE_W/2, BASE_H/2 - 30);
  ctx.lineTo(BASE_W/2 + 50, BASE_H/2 + 50);
  ctx.lineTo(BASE_W/2 - 50, BASE_H/2 + 50);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#e0a800'; ctx.lineWidth=3; ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 22px Arial';
  ctx.fillText('¡Llegaste al Queso Gigante!', BASE_W/2, BASE_H/2 + 80);
  ctx.fillStyle = '#ffe000';
  ctx.font = '20px Arial';
  ctx.fillText('Puntuación final: ' + score + ' quesos', BASE_W/2, BASE_H/2 + 112);
  ctx.fillStyle = '#aaffaa';
  ctx.font = 'bold 18px Arial Black';
  const blink = Math.floor(Date.now()/600) % 2 === 0;
  if(blink) ctx.fillText('ENTER o CLICK para jugar de nuevo', BASE_W/2, BASE_H/2 + 150);
}

// ---------- GAME LOOP ----------
let lastTime = 0;
function gameLoop(timestamp) {
  const dt = timestamp - lastTime;
  lastTime = timestamp;

  ctx.clearRect(0,0,BASE_W,BASE_H);

  if(state === 'start') {
    drawStartScreen();
  } else if(state === 'gameover') {
    // Dibujar nivel de fondo
    drawBackground();
    drawTiles();
    drawGameOverScreen();
  } else if(state === 'win') {
    drawBackground();
    drawTiles();
    drawWinScreen();
  } else if(state === 'playing') {
    const solidBlocks = getAllSolidBlocks();

    updatePlayer(solidBlocks);
    updateEnemies(solidBlocks);
    updateTom();
    checkPlayerCollisions();
    updateCamera();
    updateParticles();

    // Dibujar
    drawBackground();
    drawTiles();
    brickBlocks.forEach(b => drawBrickBlock(b));
    questionBlocks.forEach(b => drawQuestionBlock(b));
    traps.forEach(t => drawTrap(t));
    cheeses.forEach(c => drawCheese(c));
    drawGoal();
    enemies.forEach(e => drawEnemy(e));
    drawTom();
    drawJerry();
    drawParticles();
    drawFloatingTexts();
    drawHUD();
  }

  requestAnimationFrame(gameLoop);
}

// ---------- EVENTOS ----------
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if((e.code === 'Enter' || e.code === 'Space') && state !== 'playing') {
    e.preventDefault();
    initGame();
  }
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
});

document.addEventListener('keyup', e => { keys[e.code] = false; });

canvas.addEventListener('click', () => {
  if(state !== 'playing') initGame();
});

// Mobile touch controls
let touchStartX = 0, touchStartY = 0;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if(state !== 'playing') { initGame(); return; }
  const t = e.touches[0];
  touchStartX = t.clientX;
  touchStartY = t.clientY;
  const rect = canvas.getBoundingClientRect();
  const tx = t.clientX - rect.left;
  const ty = t.clientY - rect.top;
  // Mitad inferior izquierda → izquierda, derecha → derecha
  if(ty > BASE_H * 0.6) {
    if(tx < BASE_W/2) keys['ArrowLeft'] = true;
    else keys['ArrowRight'] = true;
  } else {
    keys['ArrowUp'] = true;
    setTimeout(() => { keys['ArrowUp'] = false; }, 200);
  }
}, {passive:false});

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  keys['ArrowLeft'] = false;
  keys['ArrowRight'] = false;
}, {passive:false});

// Iniciar loop
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
