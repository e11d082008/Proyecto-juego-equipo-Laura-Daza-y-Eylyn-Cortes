<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tom & Jerry: Super Mario Style</title>
    <style>
        body {
            margin: 0; padding: 0;
            background: linear-gradient(to bottom, #4da1ff 0%, #ffffff 100%); /* Cielo estilo Mario */
            display: flex; flex-direction: column; align-items: center;
            height: 100vh; font-family: 'Arial Black', sans-serif; overflow: hidden;
        }
        canvas {
            background-color: #5c94fc; /* Azul clásico de Mario */
            border: 5px solid #000;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            display: block;
        }
        #hud {
            display: flex; justify-content: space-between; width: 800px;
            padding: 10px; color: #fff; text-shadow: 2px 2px #000; font-size: 20px;
        }
    </style>
</head>
<body>

    <div id="hud">
        <div>JERRY (P1)</div>
        <div>PUNTOS: <span id="score">0</span></div>
        <div>VIDA: <span id="life">❤❤❤</span></div>
    </div>
    <canvas id="gameCanvas" width="800" height="500"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- Configuración ---
let score = 0;
let lives = 3;
const gravity = 0.6;
const keys = {};

// --- Carga de Sprites (Usando Placeholders coloridos por si no tienes los archivos) ---
const sprites = {
    jerry: new Image(),
    tom: new Image(),
    queso: new Image(),
    trampa: new Image()
};

// Aquí puedes poner links reales a tus imágenes en GitHub
sprites.jerry.src = 'https://placehold.jp/40/f39c12/ffffff/40x40.png?text=🐭'; 
sprites.tom.src = 'https://placehold.jp/60/7f8c8d/ffffff/60x60.png?text=🐱';
sprites.queso.src = 'https://placehold.jp/30/f1c40f/000000/30x30.png?text=🧀';
sprites.trampa.src = 'https://placehold.jp/30/e74c3c/ffffff/30x30.png?text=💥';

// --- Clases ---

class Entidad {
    constructor(x, y, w, h, sprite) {
        this.x = x; this.y = y; this.w = w; this.h = h;
        this.sprite = sprite;
        this.velX = 0; this.velY = 0;
        this.grounded = false;
    }
    draw() {
        ctx.drawImage(this.sprite, this.x, this.y, this.w, this.h);
    }
}

class ObstaculoDinamico {
    constructor(x, y, color) {
        this.x = x; this.y = y;
        this.baseY = y;
        this.r = 15;
        this.color = color;
        this.angle = 0;
    }
    update() {
        // Movimiento circular/ondulante como las barras de fuego de Mario
        this.y = this.baseY + Math.sin(this.angle) * 50;
        this.angle += 0.05;
        this.draw();
    }
    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.strokeStyle = "white";
        ctx.stroke();
        ctx.closePath();
    }
}

// --- Instancias ---
const jerry = new Entidad(50, 400, 40, 40, sprites.jerry);
const tom = new Entidad(700, 400, 60, 60, sprites.tom);

const plataformas = [
    {x: 0, y: 460, w: 800, h: 40, c: '#8B4513'}, // Suelo tierra
    {x: 200, y: 350, w: 100, h: 20, c: '#ff5a5f'}, // Bloque rojo
    {x: 400, y: 280, w: 100, h: 20, c: '#ffbd00'}, // Bloque amarillo
    {x: 600, y: 200, w: 100, h: 20, c: '#3fcc3f'}  // Bloque verde
];

const obstaculos = [
    new ObstaculoDinamico(250, 350, "#e74c3c"),
    new ObstaculoDinamico(450, 280, "#9b59b6")
];

// --- Lógica del Juego ---
function update() {
    if (lives <= 0) return gameOver();

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Dibujar Suelo decorativo estilo Mario
    ctx.fillStyle = "#2ecc71"; 
    ctx.fillRect(0, 450, 800, 10); // Césped

    // Plataformas
    plataformas.forEach(plat => {
        ctx.fillStyle = plat.c;
        ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
        ctx.strokeStyle = "#000";
        ctx.strokeRect(plat.x, plat.y, plat.w, plat.h);
    });

    // Control Jerry
    if (keys['ArrowRight'] || keys['d']) jerry.velX = 5;
    if (keys['ArrowLeft'] || keys['a']) jerry.velX = -5;
    if ((keys['ArrowUp'] || keys[' ']) && jerry.grounded) {
        jerry.velY = -12;
        jerry.grounded = false;
    }

    // Física Jerry
    jerry.velY += gravity;
    jerry.x += jerry.velX;
    jerry.y += jerry.velY;
    jerry.velX *= 0.8;
    jerry.grounded = false;

    // IA Tom (Más agresiva)
    if (tom.x < jerry.x) tom.velX = 2; else tom.velX = -2;
    tom.x += tom.velX;
    tom.y += tom.velY;
    tom.velY += gravity;

    // Colisiones con plataformas
    [jerry, tom].forEach(ent => {
        plataformas.forEach(plat => {
            if (ent.x < plat.x + plat.w && ent.x + ent.w > plat.x &&
                ent.y < plat.y + plat.h && ent.y + ent.h > plat.y) {
                if (ent.velY > 0) {
                    ent.y = plat.y - ent.h;
                    ent.velY = 0;
                    ent.grounded = true;
                }
            }
        });
        if (ent.y + ent.h > 500) { ent.y = 500 - ent.h; ent.velY = 0; ent.grounded = true; }
        ent.draw();
    });

    // Obstáculos dinámicos y colisión
    obstaculos.forEach(obs => {
        obs.update();
        let dx = jerry.x + 20 - obs.x;
        let dy = jerry.y + 20 - obs.y;
        let distance = Math.sqrt(dx * dx + dy * dy);
        if (distance < 25) {
            resetPos();
            lives--;
            document.getElementById('life').innerText = "❤".repeat(lives);
        }
    });

    // Colisión con Tom
    if (Math.abs(jerry.x - tom.x) < 40 && Math.abs(jerry.y - tom.y) < 40) {
        resetPos();
        lives--;
        document.getElementById('life').innerText = "❤".repeat(lives);
    }

    score++;
    document.getElementById('score').innerText = Math.floor(score/10);
    requestAnimationFrame(update);
}

function resetPos() {
    jerry.x = 50; jerry.y = 400;
    tom.x = 700; tom.y = 400;
}

function gameOver() {
    ctx.fillStyle = "rgba(0,0,0,0.7)";
    ctx.fillRect(0,0,800,500);
    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    ctx.font = "40px Arial Black";
    ctx.fillText("¡GAME OVER!", 400, 250);
    ctx.font = "20px Arial";
    ctx.fillText("Presiona F5 para intentar de nuevo", 400, 300);
}

window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

// Iniciar
update();
</script>
</body>
</html>
